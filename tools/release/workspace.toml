# All five crates in the repository as one workspace, beside a checkout
# named `checkout` and with tools/release/Cargo.lock as its lock:
# tools/crates-release.sh packages the three published crates from it,
# tools/dependency_policy.py checks all five crates' dependencies in it,
# and tools/ci-locked.sh runs library, C API, and test-vector CI checks
# against tools/release/Cargo.lock.
[workspace]
members = ["checkout/version", "checkout", "checkout/threads", "checkout/capi", "checkout/test_vectors"]
resolver = "3"
