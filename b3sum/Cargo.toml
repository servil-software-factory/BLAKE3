# Published as b3sums (b3sum is official BLAKE3's on crates.io); the
# program it installs is b3sum.
[package]
name = "b3sums"
version = "0.10.0+dev"
authors = ["Jack O'Connor <oconnor663@gmail.com>", "John Servil"]
description = "b3sum, the BLAKE3 command-line hasher, on blake3-servil: the same digests, faster"
repository = "https://github.com/servil-software-factory/BLAKE3"
license = "MIT OR Apache-2.0 OR TGPPL-1.0" # OR BOSL-1.0, see LICENSE-BOSL.txt
readme = "README.md"
edition = "2024"

[[bin]]
name = "b3sum"
path = "src/main.rs"

[features]

[dependencies]
blake3 = { version = "=0.10.0+dev", path = "../threads", package = "blake3-servil" }

# Unix syscalls: memory-mapped reads, direct I/O, io_uring, signals, fstat.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# bao-tree, the outboard's independent implementation (--outboard's tests).
bao-tree = { version = "=0.17.0", default-features = false }

# A panic stops the process at once (crash-only): nothing unwinds past a
# thread's reads that the kernel still has in flight, whose buffers the
# unwinding would free while the other threads go on hashing.
[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_patterns = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "allow", priority = -1 }
style = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
cast_possible_truncation = "deny"
print_stdout = "deny"
print_stderr = "deny"
