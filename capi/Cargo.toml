[package]
name = "blake3-servil-c"
version = "0.10.0+dev"
description = "BLAKE3, BLAKE3-Servil's C API (b3.h)"
edition = "2024"
license = "MIT OR Apache-2.0 OR TGPPL-1.0" # OR BOSL-1.0, see LICENSE-BOSL.txt
publish = false

[lib]
name = "b3_servil"

[dependencies]
blake3-servil = { path = "..", package = "blake3-servil-core" }

[features]
capi = []

[package.metadata.capi]
min_version = "0.10.26"

[package.metadata.capi.header]
name = "b3"
subdirectory = ""
generation = false

[package.metadata.capi.install.include]
asset = [{ from = "b3.h", to = "" }]

[package.metadata.capi.library]
name = "b3_servil"
version_suffix_components = 2

[package.metadata.capi.pkg_config]
name = "b3_servil"
filename = "b3_servil"

[dev-dependencies]
libc = "0.2"

[profile.release]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_patterns = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "allow", priority = -1 }
style = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
cast_possible_truncation = "deny"
