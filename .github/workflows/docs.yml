# Both crates' API documentation, published at servil-software-factory.github.io/BLAKE3
# from every push to main: the doors that the benchmark's map links its
# call names to (bench-hashes tools/map-mockup).
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    # The job's one clock, explicit: several times any job's run, far below
    # GitHub's implicit 360. GitHub reports a job past it as timed out, not failed.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh tools/ci-rust.sh stable
      - name: Document both libraries in one site
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --lib --target-dir target
          cargo doc --no-deps --lib --manifest-path threads/Cargo.toml --target-dir target
          test -f target/doc/blake3_servil_core/index.html
          test -f target/doc/blake3_servil/index.html
          echo '<meta http-equiv="refresh" content="0; url=blake3_servil/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/doc
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
