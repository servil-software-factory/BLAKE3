name: release artifacts

# What users download for a release is a clean build of the release's
# version commit: crates.io's packages file by file against the commit
# (tools/release_artifacts.py), and byte for byte what these two machines
# package from the tag (tools/crates-release.sh, whose archives are
# reproducible): a crate with other code or lock metadata fails here
# whatever it says of itself. The tag itself is held to the code commit its
# name gives and to main's history: a moved tag fails. Run when a release
# is published, and by hand for any release's tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag: vX.Y.Z+<the code commit>"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: crates, packaged again from the tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        # The version commit and its parent, which it names.
        fetch-depth: 2
    - run: sh tools/ci-rust.sh stable
    - run: sh tools/crates-release.sh --no-verify
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: crates-${{ runner.arch }}
        path: dist/

  clean:
    name: every published artifact is a clean build of the version commit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        # The tag and its commit's files, to compare the crates with.
        fetch-depth: 0
    # The checker is the code commit's, which the tag's name gives by its
    # hash: the tag's own commit is what is being checked, and a forged one
    # could bring a checker that passes it. The check then holds the tag's
    # commit to that code commit with the version written in, so what the
    # jobs above built with was the code commit's too.
    - name: Take the checker from the code commit in the tag's name
      env:
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        # main by name, whatever the checkout above fetched: the check asks
        # whether the tag's commit is in its history (BLAKE3 #438).
        git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
        git checkout --quiet --detach "${TAG#*+}"
        test -f tools/release_artifacts.py || { echo "this release is from before the check (0.9.0 and earlier): run a later commit's checker on its tag by hand"; exit 1; }
    # Each job's files in a folder of their own under rebuilt/, not merged
    # into one: merged, the later job's crates replace the earlier job's
    # unread, and a builder whose crate differed would go unseen. The
    # check compares what was published with every builder's copy, and is
    # told which builders there are (the two jobs above, by their
    # artifacts' names): each must have left its folder, with every crate.
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: crates-*
        path: rebuilt
    - name: tools/release_artifacts.py TAG --published --rebuilt rebuilt --builders crates-X64=x86_64-unknown-linux-gnu,crates-ARM64=aarch64-unknown-linux-gnu
      env:
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 tools/release_artifacts.py "$TAG" --published --rebuilt rebuilt --builders crates-X64=x86_64-unknown-linux-gnu,crates-ARM64=aarch64-unknown-linux-gnu

  close-milestone:
    name: close the release's completed milestone
    needs: clean
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 2
    - name: Take the milestone helper from the code commit in the tag's name
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        git checkout --quiet --detach "${TAG#*+}"
        test -f tools/close_release_milestone.py || { echo "release predates tools/close_release_milestone.py; skipping"; exit 0; }
    - name: close completed milestone for TAG
      env:
        TAG: ${{ github.event.release.tag_name }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        test -f tools/close_release_milestone.py || exit 0
        python3 tools/close_release_milestone.py "$TAG"
