name: tests

on:
  # Started by hand for a promotion candidate that touches code for other
  # targets (x86), and for every pull
  # request; the AArch64 builds and proofs run on the VM and the Mac
  # (CONTRIBUTING.md: tools/check-builds.sh, tools/verify/long-proofs.sh).
  pull_request:
  workflow_dispatch:

# A newer run on a branch supersedes its running tests.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BLAKE3_CI: "1"
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  # Every crate in the tree formatted by rustfmt.toml at the root.
  rustfmt:
    runs-on: ubuntu-latest
    # The job's one clock, explicit: several times any job's run, far below
    # GitHub's implicit 360. GitHub reports a job past it as timed out, not failed.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Long-proof cache identity
      run: python3 -m unittest discover -s tools/verify -p test_long_proof_inputs.py -v
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        components: rustfmt
    - name: cargo fmt --check, in each crate
      run: for d in $(git ls-files '*Cargo.toml' | xargs -n1 dirname); do (cd "$d" && cargo fmt --all -- --check) || exit 1; done
    - name: Release-tool controls
      run: python3 tools/test_one_assignee.py && python3 tools/test_release_check.py && python3 tools/test_release_artifacts.py && python3 tools/test_gen_ver.py && python3 tools/test_land.py && python3 tools/test_unsafe_reasons.py && python3 tools/unsafe_reasons.py && python3 tools/test_pipeline_model_controls.py && python3 tools/test_api.py

  library_tests:
    name: ${{ matrix.target.name }} ${{ matrix.channel }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # x86 alone: the AArch64 builds run on the VM and the Mac
        # (tools/check-builds.sh and the suites), where the x86 feature
        # flags below would build the same code each time.
        target: [
          { "os": "ubuntu-latest",    "toolchain": "x86_64-unknown-linux-gnu",  "name": "Linux GNU" }
        ]
        channel: ["stable", "nightly"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ format('{0}-{1}', matrix.channel, matrix.target.toolchain) }}
    - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
    - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
      with:
        tool: cargo-c@0.10.26
    # The compiler and the instruction sets, for debugging (the two tools
    # that printed them went in d6390649).
    - name: print compiler version and instruction set support
      run: rustc -vV && grep -m1 -E '^(flags|Features)' /proc/cpuinfo
    # The tests run under cargo-nextest, each in its own process (AGENTS:
    # "Tests run under nextest"); the doc examples under cargo test --doc.
    # Default tests plus the optional trait implementations (every public
    # feature).
    - run: cargo nextest run --features=serde
    - run: cargo test --doc --features=serde
    # no_std tests.
    - run: cargo nextest run --no-default-features
    - name: Make sure enabling LTO via CFLAGS doesn't break the build.
      run: cargo build --tests
      env:
        CFLAGS: -flto

    # The test profile (optimized, its assertions and overflow checks on:
    # Cargo.toml), and the release profile, for the optimizer's own
    # behavior.
    - run: cargo nextest run --features=
    - run: cargo nextest run --features= --release
    # The crate with the pool and the stream (threads/).
    - name: threads
      run: cargo nextest run --no-fail-fast && cargo nextest run --release && cargo test --doc
      working-directory: ./threads

    # Test vectors.
    - name: test vectors
      run: cargo nextest run
      working-directory: ./test_vectors
    # The C API (capi/: b3.h over the crate).
    - name: C API
      run: cargo nextest run --release
      working-directory: ./capi

  b3sum_tests:
    name: b3sum ${{ matrix.target.name }} ${{ matrix.channel }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # x86 alone: the AArch64 builds run on the VM and the Mac
        # (tools/check-builds.sh and the suites), where the x86 feature
        # flags below would build the same code each time.
        target: [
          { "os": "ubuntu-latest",    "toolchain": "x86_64-unknown-linux-gnu",  "name": "Linux GNU" }
        ]
        channel: ["stable", "nightly"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ format('{0}-{1}', matrix.channel, matrix.target.toolchain) }}
    - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
    # Test b3sum.
    - name: test b3sum
      run: cargo nextest run
      working-directory: ./b3sum
    - name: test b3sum --no-default-features
      run: cargo nextest run --no-default-features
      working-directory: ./b3sum
    - name: Make sure enabling LTO via CFLAGS doesn't break the build.
      run: cargo build
      env:
        CFLAGS: -flto
      working-directory: ./b3sum

  aarch64_without_sme2:
    # The AArch64 paths our machines (an M4 Max and a VM on it) never run:
    # a CPU without SME2 (this runner, a Neoverse N2), and one without the
    # SHA-3 extension either (QEMU as a Cortex-A72, as in a Raspberry Pi 4
    # or a Graviton 2), whose detection then picks the plain NEON kernels.
    name: "AArch64 without SME2, and without SHA-3 (QEMU Cortex-A72)"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Clang assembles the SME2 kernel, which this build carries as users'
    # do (GCC 13 here cannot); detection then leaves it out.
    env:
      CC: clang
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
    - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
    - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
      with:
        tool: cargo-c@0.10.26
    - run: cargo nextest run --lib --tests --features=serde
    - name: threads
      run: cargo nextest run --lib --tests --no-fail-fast
      working-directory: ./threads
    # Both suites once more on a build without the SME2 unit, as a C
    # compiler that cannot assemble SME2 makes it (GCC 13 and older: this
    # image's cc, Debian 12's, Raspberry Pi OS's). There the kernels take
    # 16 inputs a call (MAX_SIMD_DEGREE), where every other AArch64 build
    # tested takes 128 and x86-64 Linux 32. x86-64 off Linux takes 16
    # too, and no test runs there. A change that asked the kernels for
    # 32 parents in one call passed every other test (BLAKE3 #472). The
    # compiler here is a wrapper that refuses the SME2 flag whatever cc
    # becomes (the flag alone: a path may hold the word), and the step
    # fails unless the build says that it left the kernel out.
    - name: without the SME2 unit (16 inputs a call)
      run: |
        printf '#!/bin/sh\ncase " $* " in *" -march=armv9-a+sme2 "*) exit 1;; esac\nexec cc "$@"\n' > "$RUNNER_TEMP/cc-refuses-armv9"
        chmod +x "$RUNNER_TEMP/cc-refuses-armv9"
        export CC="$RUNNER_TEMP/cc-refuses-armv9" CARGO_TARGET_DIR="$PWD/target/sixteen"
        unset BLAKE3_CI
        cargo nextest run --lib --tests --features=serde > sixteen.log 2>&1 || { cat sixteen.log; exit 1; }
        cat sixteen.log
        grep -q "leaves out the SME2 kernel" sixteen.log
        cd threads && cargo nextest run --lib --tests --no-fail-fast
    # QEMU 11.1.2, Debian's static build, pinned by its SHA-256 and BLAKE3
    # hashes: the runner's own (Ubuntu's 8.2.2) crashed itself now and then
    # emulating a test's intended panic (#113).
    - name: QEMU 11.1.2
      run: |
        curl -sSfLO --retry 3 https://snapshot.debian.org/archive/debian/20261115T000000Z/pool/main/q/qemu/qemu-user_11.1.2+ds-3_arm64.deb
        echo "e278d393447a97b548728918af8e395a33086f5b7100138e38cf06a41766612e  qemu-user_11.1.2+ds-3_arm64.deb" | sha256sum -c
        echo "7c3f49bb0945cf7e2148480118a34dc34ef1641cf5f83f0137996b78f2202945  qemu-user_11.1.2+ds-3_arm64.deb" > qemu.b3
        cargo run -q --release --manifest-path b3sum/Cargo.toml -- -c qemu.b3
        ar x qemu-user_11.1.2+ds-3_arm64.deb data.tar.xz && tar xJf data.tar.xz ./usr/bin/qemu-aarch64
        sudo install usr/bin/qemu-aarch64 /usr/local/bin/qemu-aarch64 && qemu-aarch64 --version
    - run: cargo nextest run --lib --tests --features=serde
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu cortex-a72
        # tests/pool_fairness.rs measures the pool's shares by time, which an
        # emulator's scheduling decides: it skips (#213).
        BLAKE3_EMULATED: 1
    - name: threads, as a Cortex-A72
      run: cargo nextest run --lib --tests
      working-directory: ./threads
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu cortex-a72
        BLAKE3_EMULATED: 1
    - name: C API
      run: cargo nextest run --release
      working-directory: ./capi

  capi_macos:
    name: "C API on macOS (installed consumers)"
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
    - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
    - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
      with:
        tool: cargo-c@0.10.26
    - run: brew install pkg-config
    # The same installed-consumer test as on Linux: shared and static
    # installations, pkg-config flags, C11 and C++11 callers.
    - name: C API
      run: cargo nextest run --release --manifest-path capi/Cargo.toml

  # The oldest GCC supported (CONTRIBUTING.md): Debian 12's, the oldest in a
  # supported distribution (Debian 11's support ended in August 2026). Older compilers are unsupported (GCC 5.4's
  # assembler rejects the AVX-512 code GCC 5.4 itself emits at -O3; GCC 5
  # was superseded in 2016). Upstream's reason for an old-GCC job:
  # https://github.com/BLAKE3-team/BLAKE3/issues/271. The runner may lack
  # AVX-512; the build is the check that holds on every runner.
  gcc_floor:
    name: "compile and test with GCC 12, the oldest supported"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
      with:
        image: gcc:12@sha256:3d3af69c72edf0652bb3a829965142e81891899c7827d849bc3c0dbb9edd216a
        options: -v ${{ github.workspace }}:/work
        run: |
          cat /proc/cpuinfo
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init
          echo "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55  /tmp/rustup-init" | sha256sum -c
          chmod +x /tmp/rustup-init && /tmp/rustup-init -y --profile minimal && rm /tmp/rustup-init
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/nextest.tar.gz https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  /tmp/nextest.tar.gz" | sha256sum -c
          tar zxf /tmp/nextest.tar.gz -C ~/.cargo/bin && rm /tmp/nextest.tar.gz
          cd /work
          ~/.cargo/bin/cargo nextest run
          ~/.cargo/bin/cargo test --doc
          cd threads && ~/.cargo/bin/cargo nextest run --no-fail-fast

  # x86-64's three kernel widths, whichever CPU this runner is: the suites
  # as an AVX-512 CPU (Ice Lake server), as one with AVX2 and no AVX-512
  # (Haswell), and as one with SSE4.1 alone (Nehalem), under Intel's
  # Software Development Emulator. The other Linux jobs run the widths of
  # the runner they draw, and about half have no AVX-512: a test's AVX-512
  # expectations went unrun through review and several CI rounds (#346).
  # The emulator is pinned by its SHA-256 and BLAKE3 hashes; its licence
  # (Intel Simplified Software License, in its Licenses/) allows use and
  # unmodified redistribution.
  x86_widths:
    name: "x86-64 as ${{ matrix.cpu.name }} (Intel SDE)"
    # Ubuntu 24.04, not the latest: 26.04's C library on GitHub's image
    # refuses a CPU without AVX2 ("CPU does not support x86-64-v3"), so
    # nothing there can run as a Nehalem.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [
          { "flag": "icx", "name": "an Ice Lake server CPU: AVX-512" },
          { "flag": "hsw", "name": "a Haswell: AVX2, no AVX-512" },
          { "flag": "nhm", "name": "a Nehalem: SSE4.1, no AVX2" },
        ]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
    - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
    # What this runner is, beside what it is about to run as.
    - run: grep -o -w 'avx512f\|avx512vl\|avx2\|sse4_1' /proc/cpuinfo | sort -u
    - name: Intel SDE 9.58.0
      run: |
        curl -sSfL -o sde.tar.xz https://downloadmirror.intel.com/859732/sde-external-9.58.0-2025-06-16-lin.tar.xz
        echo "f849acecad4c9b108259c643b2688fd65c35723cd23368abe5dd64b917cc18c0  sde.tar.xz" | sha256sum -c
        echo "22b6383cfadc97177e0bf3e432ca339a734222b53fb8c00d4a6e51797d96f27f  sde.tar.xz" > sde.b3
        cargo run -q --release --manifest-path b3sum/Cargo.toml -- -c sde.b3
        mkdir "$RUNNER_TEMP/sde" && tar xJf sde.tar.xz -C "$RUNNER_TEMP/sde" --strip-components=1
        rm sde.tar.xz sde.b3
        "$RUNNER_TEMP/sde/sde64" -version | head -n 1
    - run: cargo nextest run --release --lib --tests --no-run
    # The `emulated` profile's clock (.config/nextest.toml): a test runs
    # tens of times slower here than on the CPU.
    # The emulator stops a test at the first instruction the CPU it plays
    # lacks. It checks the test's own executable, which holds the library
    # and its kernels, and not the system's libraries: as a Nehalem, the
    # runner's dynamic loader (chosen for the real CPU) ran an AVX
    # instruction before any test did.
    - run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$RUNNER_TEMP/sde/sde64 -${{ matrix.cpu.flag }} -chip_check_exe_only -- " cargo nextest run -P emulated --release --lib --tests
    - name: threads, emulated
      working-directory: ./threads
      run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$RUNNER_TEMP/sde/sde64 -${{ matrix.cpu.flag }} -chip_check_exe_only -- " cargo nextest run -P emulated --release --lib --tests

  x86_model:
    name: "the x86-64 proofs' model against the CPU"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    # GitHub's runners vary: the AVX-512 forms are checked on those that
    # have AVX-512, and this line says which this one is.
    - run: grep -o -w 'avx512f\|avx512vl\|avx2\|sse4_1' /proc/cpuinfo | sort -u
    - run: |
        sudo apt-get install -y llvm lld clang
        printf '%s\n' \
          'z3-solver==5.4.1.0 \' \
          '  --hash=sha256:e680ce083683abca5d07c3e55c2f620ff9a29cb91c548eeeea27ae29e8060522 \' \
          '  --hash=sha256:f2c745d1623128400c208d875fba741ccd88f061cb89b5661a9f2169eb24b110' \
          > /tmp/z3.req
        pip install --require-hashes -r /tmp/z3.req && rm /tmp/z3.req
    - run: python3 tools/verify/cross_check_x86.py

  b3sum_release_build:
    # b3sum's release binary, built as a release builds it
    # (tools/b3sum-release.sh): for a version commit, the second build
    # that tools/release-check.py compares ours with, byte for byte; for
    # every other commit, the proof that the script still works.
    name: b3sum release build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        # The commit and its parent: a version commit names its parent.
        fetch-depth: 2
    - run: docker run --rm -e B3SUM_RELEASE_ANY_COMMIT=1 -v "$PWD":/src -w /src ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db sh tools/b3sum-release-container.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: b3sum-${{ runner.arch }}
        path: dist/
