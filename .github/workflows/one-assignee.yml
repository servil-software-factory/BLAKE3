# Every open issue and pull request has one assignee, the person whose move
# is next (AGENTS.md). tools/one_assignee.py assigns whoever a "Next move:"
# line names (or replies when that fails), assigns the author to an item
# left with none, and asks when there are several.
name: one assignee
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, reopened, unassigned, assigned]
  pull_request_target:
    types: [opened, reopened, unassigned, assigned]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 tools/one_assignee.py "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
