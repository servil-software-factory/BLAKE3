name: flake probe
on:
  push:
    branches: ["probe/flake"]
jobs:
  loop:
    name: ${{ matrix.build }} ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        build: ["asan", "plain"]
        run: ["a", "b", "c"]
    steps:
    - uses: actions/checkout@v4
      with:
        # next before the Pipeline's late read was fixed (80c8d525)
        ref: 510c942fda9da480ed49ddec9bcecf6f73f4a59e
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable-x86_64-unknown-linux-gnu
    - name: loop
      working-directory: ./b3sum
      run: |
        if [ ${{ matrix.build }} = asan ]; then export RUSTC_BOOTSTRAP=1 RUSTFLAGS="-Zsanitizer=address"; fi
        BIN=$(CARGO_TERM_COLOR=never cargo test --no-run --target x86_64-unknown-linux-gnu 2>&1 | sed -n 's/.*Executable unittests src\/main.rs (\(.*\))/\1/p' | head -1)
        echo "binary: $BIN"; nproc
        fails=0; asan=0; n=600
        [ ${{ matrix.build }} = asan ] && n=300
        for i in $(seq 1 $n); do
          if ! $BIN --exact linux_pipe::test::forced_misses_take_the_cold_paths_for_every_size_class > out.txt 2>&1; then
            fails=$((fails+1))
            if grep -q "AddressSanitizer" out.txt; then asan=$((asan+1)); [ $asan = 1 ] && grep -A12 "ERROR: AddressSanitizer" out.txt | cut -c1-220; fi
            echo "=== run $i failed: $(tail -1 out.txt | cut -c1-120)"
          fi
        done
        echo "RESULT ${{ matrix.build }} ${{ matrix.run }}: $fails of $n runs failed, $asan with an AddressSanitizer report"
